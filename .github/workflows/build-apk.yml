name: Build Daily Collection APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17 (Zulu for Gradle Runner)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Find and extract project ZIP
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1); fi
          if [ -z "$ZIP" ]; then echo "No ZIP found in repo root!"; exit 1; fi
          echo "Using: $ZIP"
          rm -rf /tmp/project_src
          mkdir -p /tmp/project_src
          unzip -o "$ZIP" -d /tmp/project_src

      - name: Copy project files correctly
        run: |
          mkdir -p /tmp/build
          if [ -d "/tmp/project_src/daily_collection_app" ]; then
            cp -r /tmp/project_src/daily_collection_app/. /tmp/build/
          else
            cp -r /tmp/project_src/. /tmp/build/
          fi
          ls -la /tmp/build
          if [ ! -f "/tmp/build/pubspec.yaml" ]; then
            echo "Error: pubspec.yaml not found in /tmp/build!"
            exit 1
          fi

      - name: Create Flutter Android scaffolding (v2 embedding fix)
        working-directory: /tmp/build
        run: |
          flutter create --org com.dailyhisab --project-name daily_collection_app .

      - name: Flutter clean + pub get
        working-directory: /tmp/build
        run: |
          flutter clean
          flutter pub get

      - name: Final Bullets Fix (Telephony, Manifest, & Force compileSdk 36)
        working-directory: /tmp/build
        run: |
          # 1. Remove obsolete package attribute from telephony AndroidManifest.xml
          for m in $(find /home/runner/.pub-cache -path "*/telephony-*/android/src/main/AndroidManifest.xml"); do
            echo "Removing package attribute from manifest at $m"
            sed -i 's/package="[^"]*"//g' "$m"
            sed -i "s/package='[^']*'//g" "$m"
          done

          # 2. Patch telephony build.gradle for namespace and jvmTarget = '11'
          for f in $(find /home/runner/.pub-cache -path "*/telephony-*/android/build.gradle"); do
            echo "Patching telephony build.gradle at $f"
            if ! grep -q "namespace" "$f"; then
              sed -i "/android {/a \    namespace 'com.shounakmulay.telephony'" "$f"
            fi
            if grep -q "jvmTarget" "$f"; then
              sed -i "s/jvmTarget.*=.*['\"].*['\"]/jvmTarget = '11'/g" "$f"
            else
              sed -i "/android {/a \    kotlinOptions { jvmTarget = '11' }" "$f"
            fi
          done

          # 3. Force compileSdk and targetSdk to 36 dynamically in android/app/build.gradle AFTER flutter create
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            echo "Forcing compileSdk and targetSdk to 36 in $BUILD_GRADLE"
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$BUILD_GRADLE"
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' "$BUILD_GRADLE"
            sed -i 's/compileSdk [0-9]*/compileSdk 36/g' "$BUILD_GRADLE"
            sed -i 's/targetSdk [0-9]*/targetSdk 36/g' "$BUILD_GRADLE"
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' "$BUILD_GRADLE"
            sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' "$BUILD_GRADLE"
            
            # Agar file mein compileSdk explicitly nahi mila toh android block ke andar insert kar do
            if ! grep -q "compileSdk 36" "$BUILD_GRADLE" && ! grep -q "compileSdkVersion 36" "$BUILD_GRADLE"; then
              sed -i "/android {/a \    compileSdkVersion 36\n    defaultConfig { targetSdkVersion 36 }" "$BUILD_GRADLE"
            fi
          fi

          # 4. Force Java 11 and Kotlin 11 across all subprojects
          if [ -f android/build.gradle ]; then
            cat >> android/build.gradle << 'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace = project.group
                          }
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_11
                              targetCompatibility JavaVersion.VERSION_11
                          }
                      }
                  }
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = '11'
                  }
              }
          }
          EOF
          fi

      - name: Build release APK
        working-directory: /tmp/build
        run: |
          flutter build apk --release

      - name: Find and Save APK
        if: always()
        run: |
          APK=$(find /tmp/build -name "*.apk" 2>/dev/null | head -n 1)
          echo "APK found: $APK"
          mkdir -p /tmp/apk_out
          if [ -n "$APK" ]; then cp "$APK" /tmp/apk_out/daily-collection.apk; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: /tmp/apk_out/
          if-no-files-found: error
