name: Build Daily Collection APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
      - uses: actions/checkout@v5

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Locate project directory
        run: |
          # Ye check karega ki project files kahan hain
          find . -maxdepth 3 -name "pubspec.yaml"

      - name: Install dependencies & Build APK
        run: |
          # Agar pubspec.yaml kisi subfolder mein hai toh find karke wahan run hoga
          DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
          echo "Found Flutter project at: $DIR"
          cd "$DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-release-apk
          path: "**/app-release.apk"
          if-no-files-found: error
