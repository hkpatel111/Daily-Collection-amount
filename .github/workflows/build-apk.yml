name: Build Daily Collection APK v8

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show workspace
        run: |
          echo "=== Workspace contents ==="
          ls -la
          find . -name "*.zip" -type f || true

      - name: Extract project ZIP
        run: |
          ZIPFILE=$(find . -maxdepth 2 -name "daily_collection*.zip" -type f | head -1)
          if [ -z "$ZIPFILE" ]; then
            ZIPFILE=$(find . -maxdepth 2 -name "*.zip" -type f | head -1)
          fi
          if [ -n "$ZIPFILE" ]; then
            echo "Found ZIP: $ZIPFILE"
            rm -rf extracted
            mkdir -p extracted
            unzip -o "$ZIPFILE" -d extracted
            echo "=== Extracted structure ==="
            find extracted -maxdepth 3 -type d
            # Copy project files to root
            if [ -d extracted/daily_collection_app ]; then
              cp -a extracted/daily_collection_app/. .
            elif [ -d extracted/daily_collection_v8 ]; then
              cp -a extracted/daily_collection_v8/. .
            elif [ -f extracted/pubspec.yaml ]; then
              cp -a extracted/. .
            else
              # nested one more level?
              INNER=$(find extracted -name "pubspec.yaml" | head -1)
              if [ -n "$INNER" ]; then
                DIR=$(dirname "$INNER")
                echo "Found pubspec in $DIR"
                cp -a "$DIR"/. .
              fi
            fi
          else
            echo "No ZIP found - assuming source already present"
          fi
          echo "=== After extract ==="
          ls -la
          test -f pubspec.yaml && echo "pubspec.yaml OK" || echo "ERROR: pubspec.yaml missing"

      - name: Flutter create scaffolding
        run: |
          if [ ! -d android ]; then
            echo "Creating Flutter scaffolding..."
            flutter create --org com.dailyhisab --project-name daily_collection_app --platforms=android .
          else
            echo "android/ folder already exists"
          fi

      - name: Write AndroidManifest
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Daily Collection"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          MANIFEST

      - name: Fix Gradle (compileSdk 36, JVM 17, namespace)
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' android/app/build.gradle || true
            sed -i 's/compileSdkVersion [0-9]*/compileSdk 36/' android/app/build.gradle || true
            sed -i 's/sourceCompatibility JavaVersion.*/sourceCompatibility JavaVersion.VERSION_17/' android/app/build.gradle || true
            sed -i 's/targetCompatibility JavaVersion.*/targetCompatibility JavaVersion.VERSION_17/' android/app/build.gradle || true
            sed -i 's/jvmTarget = .*/jvmTarget = "17"/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' android/app/build.gradle.kts || true
            sed -i 's/sourceCompatibility = .*/sourceCompatibility = JavaVersion.VERSION_17/' android/app/build.gradle.kts || true
            sed -i 's/targetCompatibility = .*/targetCompatibility = JavaVersion.VERSION_17/' android/app/build.gradle.kts || true
            sed -i 's/jvmTarget = .*/jvmTarget = "17"/' android/app/build.gradle.kts || true
          fi
          # Namespace fix for plugins
          if [ -f android/build.gradle ]; then
            if ! grep -q "afterEvaluate" android/build.gradle; then
              cat >> android/build.gradle << 'GBEOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      if (project.android.namespace == null) {
                          project.android.namespace = "com.dailyhisab." + project.name.replace("-", "_")
                      }
                  }
              }
          }
          GBEOF
            fi
          fi
          if [ -f android/build.gradle.kts ]; then
            if ! grep -q "afterEvaluate" android/build.gradle.kts; then
              cat >> android/build.gradle.kts << 'GBEOF'

          subprojects {
              afterEvaluate {
                  if (hasProperty("android")) {
                      val android = extensions.findByName("android")
                      if (android != null && android is com.android.build.gradle.BaseExtension) {
                          if (android.namespace == null) {
                              android.namespace = "com.dailyhisab." + name.replace("-", "_")
                          }
                      }
                  }
              }
          }
          GBEOF
            fi
          fi

      - name: Flutter pub get
        run: |
          flutter clean || true
          flutter pub get

      - name: Analyze (show errors early)
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || true
          echo "=== Analyze done ==="

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Show last 80 lines of build log
        if: always()
        run: |
          echo "=== LAST 80 LINES OF BUILD LOG ==="
          tail -80 build.log || true
          echo "=== ANALYZE LOG (errors) ==="
          grep -E "error •|Error:" analyze.log | head -30 || true

      - name: Find APK
        if: always()
        run: |
          echo "=== Searching for APK ==="
          find . -name "*.apk" -type f 2>/dev/null || true
          find /home/runner -name "app-release.apk" 2>/dev/null | head -10 || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            **/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            analyze.log
          if-no-files-found: ignore
          retention-days: 7
          
