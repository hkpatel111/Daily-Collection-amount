name: Build Daily Collection APK v8

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -name "daily_collection_app_v*.zip" -type f | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found! Checking for lib/ directory..."
            if [ -d "lib" ]; then
              echo "Using existing lib/ directory"
            else
              echo "ERROR: No ZIP file or lib/ directory found!"
              exit 1
            fi
          else
            echo "Found ZIP: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

      - name: Find project directory
        id: find_dir
        run: |
          if [ -d "daily_collection_app" ]; then
            echo "project_dir=daily_collection_app" >> $GITHUB_OUTPUT
          else
            echo "project_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Copy project files to root
        run: |
          PROJECT_DIR=${{ steps.find_dir.outputs.project_dir }}
          if [ "$PROJECT_DIR" != "." ]; then
            cp -r $PROJECT_DIR/lib .
            cp $PROJECT_DIR/pubspec.yaml .
            if [ -d "$PROJECT_DIR/android" ]; then
              cp -r $PROJECT_DIR/android .
            fi
          fi
          echo "Files in root:"
          ls -la

      - name: Flutter create scaffolding
        run: flutter create --org com.dailyhisab --project-name daily_collection_app .

      - name: Write AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <application
                  android:label="Daily Collection"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2"/>
              </application>
          </manifest>
          MANIFEST_EOF

      - name: Fix Gradle settings
        run: |
          # Detect which build file format Flutter generated
          APP_GRADLE=""
          if [ -f "android/app/build.gradle.kts" ]; then
            APP_GRADLE="android/app/build.gradle.kts"
          elif [ -f "android/app/build.gradle" ]; then
            APP_GRADLE="android/app/build.gradle"
          fi

          echo "App Gradle file: $APP_GRADLE"

          if [ -n "$APP_GRADLE" ]; then
            echo "Patching $APP_GRADLE..."

            # Set compileSdk to 36
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' "$APP_GRADLE"
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' "$APP_GRADLE"

            # Set JVM target to 17
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$APP_GRADLE"
            sed -i 's/jvmTarget = "11"/jvmTarget = "17"/g' "$APP_GRADLE"
            sed -i 's/jvmTarget = "16"/jvmTarget = "17"/g' "$APP_GRADLE"
            sed -i 's/jvmTarget.set("1.8")/jvmTarget.set("17")/g' "$APP_GRADLE"

            # Set Java compatibility to 17
            sed -i 's/sourceCompatibility = JavaVersion.VERSION_1_8/sourceCompatibility = JavaVersion.VERSION_17/g' "$APP_GRADLE"
            sed -i 's/targetCompatibility = JavaVersion.VERSION_1_8/targetCompatibility = JavaVersion.VERSION_17/g' "$APP_GRADLE"
            sed -i 's/sourceCompatibility = JavaVersion.VERSION_11/sourceCompatibility = JavaVersion.VERSION_17/g' "$APP_GRADLE"
            sed -i 's/targetCompatibility = JavaVersion.VERSION_11/targetCompatibility = JavaVersion.VERSION_17/g' "$APP_GRADLE"

            echo "Done patching $APP_GRADLE"
            head -50 "$APP_GRADLE"
          fi

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get 2>&1 | tee pub_get_log.txt

      - name: Build APK
        continue-on-error: true
        run: flutter build apk --release -v 2>&1 | tee build_log.txt

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find / -name "*.apk" -path "*/release/*" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find / -name "*.apk" 2>/dev/null | head -1)
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        if: steps.find_apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Upload build output (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/
            android/
            pubspec.yaml
            .flutter-plugins
            .flutter-plugins-dependencies
            pub_get_log.txt
            build_log.txt
            
