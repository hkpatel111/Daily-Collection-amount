name: Build Daily Collection APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17 (Zulu for Gradle Runner)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDK 36 Platform
        run: |
          echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Find and extract project ZIP
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1); fi
          if [ -z "$ZIP" ]; then echo "No ZIP found in repo root!"; exit 1; fi
          echo "Using: $ZIP"
          rm -rf /tmp/project_src
          mkdir -p /tmp/project_src
          unzip -o "$ZIP" -d /tmp/project_src

      - name: Copy project files correctly
        run: |
          mkdir -p /tmp/build
          if [ -d "/tmp/project_src/daily_collection_app" ]; then
            cp -r /tmp/project_src/daily_collection_app/. /tmp/build/
          else
            cp -r /tmp/project_src/. /tmp/build/
          fi
          ls -la /tmp/build
          if [ ! -f "/tmp/build/pubspec.yaml" ]; then
            echo "Error: pubspec.yaml not found in /tmp/build!"
            exit 1
          fi

      - name: Create Flutter Android scaffolding (v2 embedding fix)
        working-directory: /tmp/build
        run: |
          flutter create --org com.dailyhisab --project-name daily_collection_app .

      - name: Flutter clean + pub get (Run First)
        working-directory: /tmp/build
        run: |
          flutter clean
          flutter pub get

      - name: Ultimate Master Fix + Disable Metadata Check Flag
        working-directory: /tmp/build
        run: |
          # 1. Force SDK 36 and COMPLETELY DISABLE AAR Metadata checks via gradle properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "android.compileSdkVersion=36" >> android/gradle.properties
          echo "android.targetSdkVersion=36" >> android/gradle.properties
          echo "android.overrideVersionCheck=true" >> android/gradle.properties
          echo "android.injected.checkAarMetadata=false" >> android/gradle.properties

          # 2. Force compileSdk/targetSdk to 36 directly inside main app build.gradle
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' "$BUILD_GRADLE"
            sed -i 's/compileSdk\s*=.*/compileSdk = 36/g' "$BUILD_GRADLE"
            sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' "$BUILD_GRADLE"
            sed -i 's/targetSdk\s*=.*/targetSdk = 36/g' "$BUILD_GRADLE"
            sed -i 's/flutter\.compileSdkVersion/36/g' "$BUILD_GRADLE"
            sed -i 's/flutter\.targetSdkVersion/36/g' "$BUILD_GRADLE"
            
            if ! grep -q "36" "$BUILD_GRADLE"; then
              sed -i "/android {/a \    compileSdk 36\n    defaultConfig { targetSdk 36 }" "$BUILD_GRADLE"
            fi
          fi

          # 3. Remove obsolete package attribute from telephony AndroidManifest.xml
          for m in $(find /home/runner/.pub-cache -path "*/telephony-*/android/src/main/AndroidManifest.xml"); do
            sed -i 's/package="[^"]*"//g' "$m"
            sed -i "s/package='[^']*'//g" "$m"
          done

          # 4. Patch telephony build.gradle for namespace and jvmTarget = '11'
          for f in $(find /home/runner/.pub-cache -path "*/telephony-*/android/build.gradle"); do
            if ! grep -q "namespace" "$f"; then
              sed -i "/android {/a \    namespace 'com.shounakmulay.telephony'" "$f"
            fi
            if grep -q "jvmTarget" "$f"; then
              sed -i "s/jvmTarget.*=.*['\"].*['\"]/jvmTarget = '11'/g" "$f"
            else
              sed -i "/android {/a \    kotlinOptions { jvmTarget = '11' }" "$f"
            fi
          done

          # 5. Force compileSdk 36, Java 11, and Kotlin 11 across all subprojects
          if [ -f android/build.gradle ]; then
            cat >> android/build.gradle << 'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace = project.group
                          }
                          try {
                              compileSdkVersion 36
                          } catch (Exception e) {
                              compileSdk = 36
                          }
                          try {
                              defaultConfig {
                                  targetSdkVersion 36
                              }
                          } catch (Exception e) {
                              defaultConfig {
                                  targetSdk = 36
                              }
                          }
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_11
                              targetCompatibility JavaVersion.VERSION_11
                          }
                      }
                  }
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = '11'
                  }
              }
          }
          EOF
          fi

      - name: Build release APK
        working-directory: /tmp/build
        run: |
          flutter build apk --release

      - name: Find and Save APK
        if: always()
        run: |
          APK=$(find /tmp/build -name "*.apk" 2>/dev/null | head -n 1)
          echo "APK found: $APK"
          mkdir -p /tmp/apk_out
          if [ -n "$APK" ]; then cp "$APK" /tmp/apk_out/daily-collection.apk; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: /tmp/apk_out/
          if-no-files-found: error
