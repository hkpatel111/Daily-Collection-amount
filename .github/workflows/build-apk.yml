name: Build Daily Collection APK v8

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Find and extract project ZIP
        run: |
          echo "Looking for ZIP files..."
          find . -name "*.zip" -type f || true
          ZIPFILE=$(find . -maxdepth 2 -name "daily_collection*.zip" -type f | head -1)
          if [ -z "$ZIPFILE" ]; then
            ZIPFILE=$(find . -maxdepth 2 -name "*.zip" -type f | head -1)
          fi
          if [ -n "$ZIPFILE" ]; then
            echo "Found ZIP: $ZIPFILE"
            unzip -o "$ZIPFILE" -d extracted || true
            # Move contents to root if nested
            if [ -d extracted/daily_collection_app ]; then
              cp -r extracted/daily_collection_app/* . || true
            elif [ -d extracted/daily_collection_v8 ]; then
              cp -r extracted/daily_collection_v8/* . || true
            else
              cp -r extracted/* . || true
            fi
          else
            echo "No ZIP found - assuming source is already in repo"
          fi
          ls -la

      - name: Flutter create scaffolding (if needed)
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Running flutter create for scaffolding..."
            flutter create --org com.dailyhisab --project-name daily_collection_app --platforms=android .
          fi

      - name: Write AndroidManifest with permissions
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Daily Collection"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Fix Gradle settings (compileSdk 36, JVM 17)
        run: |
          # Fix android/app/build.gradle or .kts
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle || true
            sed -i 's/compileSdkVersion .*/compileSdk 36/' android/app/build.gradle || true
            sed -i 's/sourceCompatibility JavaVersion.*/sourceCompatibility JavaVersion.VERSION_17/' android/app/build.gradle || true
            sed -i 's/targetCompatibility JavaVersion.*/targetCompatibility JavaVersion.VERSION_17/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
            sed -i 's/sourceCompatibility = .*/sourceCompatibility = JavaVersion.VERSION_17/' android/app/build.gradle.kts || true
            sed -i 's/targetCompatibility = .*/targetCompatibility = JavaVersion.VERSION_17/' android/app/build.gradle.kts || true
          fi
          # Namespace fix for subprojects
          if [ -f android/build.gradle ]; then
            grep -q "afterEvaluate" android/build.gradle || cat >> android/build.gradle << 'GBEOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      if (project.android.namespace == null) {
                          project.android.namespace = "com.dailyhisab." + project.name.replace("-", "_")
                      }
                  }
              }
          }
          GBEOF
          fi

      - name: Flutter clean & pub get
        run: |
          flutter clean
          flutter pub get

      - name: Build APK (release)
        id: build
        continue-on-error: true
        run: |
          flutter build apk --release -v

      - name: Locate APK
        run: |
          echo "Searching for APK..."
          find . -name "*.apk" -type f 2>/dev/null || true
          find /home/runner -name "*.apk" -type f 2>/dev/null | head -20 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            **/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/**
            **/*.log
          if-no-files-found: ignore
          retention-days: 5
          
