name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find and extract ZIP
        run: |
          ls -la
          ZIP_FILE=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted/

      - name: Find project root
        id: findroot
        run: |
          PROJECT_ROOT=$(find extracted/ -name "pubspec.yaml" -not -path "*/.git/*" | head -1 | xargs dirname)
          if [ -z "$PROJECT_ROOT" ]; then
            if [ -f "extracted/pubspec.yaml" ]; then
              PROJECT_ROOT="extracted"
            else
              echo "ERROR: Cannot find pubspec.yaml!"
              find extracted/ -type f
              exit 1
            fi
          fi
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT

      - name: Copy files to workspace
        run: |
          PROJECT_ROOT="${{ steps.findroot.outputs.project_root }}"
          cp -r "$PROJECT_ROOT"/* . 2>/dev/null || true
          cp -r "$PROJECT_ROOT"/.github . 2>/dev/null || true
          cp -r "$PROJECT_ROOT"/.gitignore . 2>/dev/null || true
          if [ ! -f "pubspec.yaml" ] && [ -d "$PROJECT_ROOT" ]; then
            cp -r "$PROJECT_ROOT"/. .
          fi

      - name: Create missing folders
        run: mkdir -p lib/models lib/database/dao lib/services lib/screens lib/widgets lib/utils test android/app/src/main

      - name: Move files to correct folders if needed
        run: |
          for f in customer.dart loan.dart schedule_entry.dart collection_entry.dart settings.dart; do
            if [ -f "$f" ] && [ ! -f "lib/models/$f" ]; then mv "$f" lib/models/; fi
          done
          for f in customer_dao.dart loan_dao.dart schedule_dao.dart collection_dao.dart settings_dao.dart; do
            if [ -f "$f" ] && [ ! -f "lib/database/dao/$f" ]; then mv "$f" lib/database/dao/; fi
          done
          if [ -f "database_helper.dart" ] && [ ! -f "lib/database/database_helper.dart" ]; then mv database_helper.dart lib/database/; fi
          for f in calculation_service.dart schedule_service.dart sms_service.dart backup_service.dart; do
            if [ -f "$f" ] && [ ! -f "lib/services/$f" ]; then mv "$f" lib/services/; fi
          done
          for f in dashboard_screen.dart customer_list_screen.dart add_customer_screen.dart customer_detail_screen.dart loan_detail_screen.dart daily_collection_screen.dart pre_close_screen.dart settings_screen.dart; do
            if [ -f "$f" ] && [ ! -f "lib/screens/$f" ]; then mv "$f" lib/screens/; fi
          done
          for f in stat_card.dart schedule_entry_tile.dart; do
            if [ -f "$f" ] && [ ! -f "lib/widgets/$f" ]; then mv "$f" lib/widgets/; fi
          done
          for f in constants.dart validators.dart; do
            if [ -f "$f" ] && [ ! -f "lib/utils/$f" ]; then mv "$f" lib/utils/; fi
          done
          if [ -f "calculation_service_test.dart" ] && [ ! -f "test/calculation_service_test.dart" ]; then mv calculation_service_test.dart test/; fi
          if [ -f "build_apk.yml" ]; then mkdir -p .github/workflows; mv build_apk.yml .github/workflows/; fi
          if [ -f "AndroidManifest.xml" ] && [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then mv AndroidManifest.xml android/app/src/main/; fi

      - name: Generate Flutter scaffolding
        run: flutter create --org com.dailyhisab --project-name daily_collection_app .

      - name: Write AndroidManifest.xml with SMS permissions
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <application
                  android:label="Daily Collection"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST

      - name: Fix all Gradle compatibility issues
        run: |
          # Fix compileSdk in app build file (check both .gradle and .kts)
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk 34/compileSdk 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' android/app/build.gradle
          elif [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = 34/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdkVersion = 34/compileSdkVersion = 36/g' android/app/build.gradle.kts
          fi
          
          cat >> android/build.gradle << 'GRADLEFIX'

          subprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.library")) {
                      project.android {
                          if (!android.namespace) {
                              def namespace = project.group.toString()
                              if (namespace) {
                                  android.namespace = namespace
                              }
                          }
                          if (android.compileSdk == null || android.compileSdk < 36) {
                              android.compileSdk = 36
                          }
                      }
                  }
                  if (project.hasProperty("android")) {
                      project.android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
                  project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions {
                          jvmTarget = "17"
                      }
                  }
              }
          }
          GRADLEFIX

      - name: Verify project structure
        run: find lib/ -type f | sort

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK (verbose, capture all output)
        run: |
          flutter build apk --release -v 2>&1 | tee /tmp/build_output.txt
        continue-on-error: true

      - name: Search for APK everywhere
        id: findapk
        run: |
          echo "=== Searching for APK in entire filesystem ==="
          find / -name "*.apk" 2>/dev/null | grep -v "platforms" | head -20
          
          APK_FILE=$(find / -name "*.apk" 2>/dev/null | grep -v "platforms" | head -1)
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          
          echo "=== Last 50 lines of build output ==="
          tail -50 /tmp/build_output.txt

      - name: Upload APK (if found)
        if: steps.findapk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: ${{ steps.findapk.outputs.apk_path }}

      - name: Upload build output (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: /tmp/build_output.txt
          
