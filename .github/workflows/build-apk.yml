name: Build Daily Collection APK v8

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract project ZIP
        run: |
          ZIPFILE=$(find . -maxdepth 2 -name "daily_collection*.zip" -type f | head -1)
          if [ -z "$ZIPFILE" ]; then
            ZIPFILE=$(find . -maxdepth 2 -name "*.zip" -type f | head -1)
          fi
          if [ -n "$ZIPFILE" ]; then
            echo "Found ZIP: $ZIPFILE"
            rm -rf extracted
            mkdir -p extracted
            unzip -o "$ZIPFILE" -d extracted
            if [ -d extracted/daily_collection_app ]; then
              cp -a extracted/daily_collection_app/. .
            elif [ -d extracted/daily_collection_v8 ]; then
              cp -a extracted/daily_collection_v8/. .
            elif [ -f extracted/pubspec.yaml ]; then
              cp -a extracted/. .
            else
              INNER=$(find extracted -name "pubspec.yaml" | head -1)
              if [ -n "$INNER" ]; then
                cp -a "$(dirname "$INNER")"/. .
              fi
            fi
          fi
          test -f pubspec.yaml && echo "pubspec.yaml OK" || (echo "ERROR: pubspec.yaml missing" && exit 1)

      - name: Flutter create scaffolding
        run: |
          rm -rf android ios .dart_tool build
          flutter create --org com.dailyhisab --project-name daily_collection_app --platforms=android .

      - name: Write AndroidManifest
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Daily Collection"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          MANIFEST

          mkdir -p test
          cat > test/widget_test.dart << 'TESTEOF'
          import 'package:flutter_test/flutter_test.dart';
          void main() {
            test('placeholder', () { expect(1 + 1, 2); });
          }
          TESTEOF

      - name: Flutter pub get
        run: |
          flutter clean || true
          flutter pub get

      - name: Fix namespace for old plugins (telephony etc.)
        run: |
          echo "Patching old Android plugins missing namespace..."
          # Patch any plugin build.gradle that has android { but no namespace
          find "$HOME/.pub-cache" -path "*/android/build.gradle" -type f 2>/dev/null | while read -r f; do
            if grep -q "android\s*{" "$f" && ! grep -q "namespace" "$f"; then
              echo "Patching: $f"
              # Insert namespace right after "android {"
              # Use a generic namespace derived from folder name
              PKG=$(echo "$f" | sed -n 's|.*/hosted/pub.dev/\([^/]*\)/.*|\1|p' | tr '.-' '_' | head -c 40)
              if [ -z "$PKG" ]; then PKG="unknown_plugin"; fi
              sed -i "s/android\s*{/android {\n    namespace \"com.dailyhisab.$PKG\"/" "$f"
            fi
          done
          # Also patch build.gradle.kts plugins if any
          find "$HOME/.pub-cache" -path "*/android/build.gradle.kts" -type f 2>/dev/null | while read -r f; do
            if grep -q "android\s*{" "$f" && ! grep -q "namespace" "$f"; then
              echo "Patching kts: $f"
              PKG=$(echo "$f" | sed -n 's|.*/hosted/pub.dev/\([^/]*\)/.*|\1|p' | tr '.-' '_' | head -c 40)
              if [ -z "$PKG" ]; then PKG="unknown_plugin"; fi
              sed -i "s/android\s*{/android {\n    namespace = \"com.dailyhisab.$PKG\"/" "$f"
            fi
          done
          echo "Namespace patch done"
          # Verify telephony
          find "$HOME/.pub-cache" -path "*telephony*/android/build.gradle" -type f 2>/dev/null | while read -r f; do
            echo "=== $f ==="
            head -30 "$f"
          done

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || true

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build.log

      - name: Show errors
        if: always()
        run: |
          echo "=== LAST 40 LINES ==="
          tail -40 build.log || true
          echo "=== KEY ERRORS ==="
          grep -E "What went wrong|error •|Error:|FAILURE|e: file|Namespace" build.log | head -25 || true
          grep -E "error •" analyze.log | head -10 || true

      - name: Find APK
        if: always()
        run: find . -name "*.apk" -type f 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            **/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            analyze.log
          if-no-files-found: ignore
          retention-days: 7
          
