name: Build Daily Collection APK v8

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract project ZIP
        run: |
          ZIPFILE=$(find . -maxdepth 2 -name "daily_collection*.zip" -type f | head -1)
          if [ -z "$ZIPFILE" ]; then ZIPFILE=$(find . -maxdepth 2 -name "*.zip" -type f | head -1); fi
          if [ -n "$ZIPFILE" ]; then
            echo "Found ZIP: $ZIPFILE"
            rm -rf extracted && mkdir -p extracted
            unzip -o "$ZIPFILE" -d extracted
            if [ -d extracted/daily_collection_app ]; then cp -a extracted/daily_collection_app/. .
            elif [ -d extracted/daily_collection_v8 ]; then cp -a extracted/daily_collection_v8/. .
            elif [ -f extracted/pubspec.yaml ]; then cp -a extracted/. .
            else
              INNER=$(find extracted -name "pubspec.yaml" | head -1)
              [ -n "$INNER" ] && cp -a "$(dirname "$INNER")"/. .
            fi
          fi
          test -f pubspec.yaml || (echo "ERROR: no pubspec" && exit 1)

      - name: Flutter create scaffolding
        run: |
          rm -rf android ios .dart_tool build
          flutter create --org com.dailyhisab --project-name daily_collection_app --platforms=android .

      - name: Set app compileSdk 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/compileSdk = [0-9][0-9]*/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk = [0-9][0-9]*/targetSdk = 36/' android/app/build.gradle.kts
            cat android/app/build.gradle.kts
          fi

      - name: Write AndroidManifest
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Daily Collection"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          MANIFEST
          mkdir -p test
          echo 'import "package:flutter_test/flutter_test.dart"; void main(){test("p",(){expect(1,1);});}' > test/widget_test.dart

      - name: Flutter pub get
        run: flutter clean || true; flutter pub get

      - name: Aggressive plugin patch (compileSdk 36 + namespace + JVM)
        run: |
          # Patch ALL android build.gradle under pub-cache
          find "$HOME/.pub-cache" \( -name "build.gradle" -o -name "build.gradle.kts" \) -path "*/android/*" 2>/dev/null | while read -r f; do
            echo "Patch: $f"
            # namespace
            if grep -qE 'android\s*\{' "$f" && ! grep -q namespace "$f"; then
              PKG=$(echo "$f" | sed -n 's|.*/hosted/pub.dev/\([^/]*\)/.*|\1|p' | tr '.-' '_' | head -c 40)
              [ -z "$PKG" ] && PKG="plugin"
              if [[ "$f" == *.kts ]]; then
                sed -i "s/android\s*{/android {\n    namespace = \"com.dailyhisab.$PKG\"/" "$f"
              else
                sed -i "s/android\s*{/android {\n    namespace \"com.dailyhisab.$PKG\"/" "$f"
              fi
            fi
            # compileSdk force 36 — many patterns
            sed -i 's/compileSdkVersion\s*=\s*flutter\.compileSdkVersion/compileSdkVersion = 36/' "$f" || true
            sed -i 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 36/' "$f" || true
            sed -i 's/compileSdkVersion\s*flutter\.compileSdkVersion/compileSdkVersion 36/' "$f" || true
            sed -i 's/compileSdkVersion\s*[0-9][0-9]*/compileSdkVersion 36/' "$f" || true
            sed -i 's/compileSdk\s*=\s*[0-9][0-9]*/compileSdk = 36/' "$f" || true
            sed -i 's/compileSdkVersion\s*=\s*[0-9][0-9]*/compileSdkVersion = 36/' "$f" || true
            # JVM
            sed -i 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' "$f" || true
            sed -i 's/JavaVersion\.VERSION_11/JavaVersion.VERSION_17/g' "$f" || true
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$f" || true
            sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" "$f" || true
          done

          # file_picker specific — show and force
          echo "=== file_picker gradle files ==="
          find "$HOME/.pub-cache" -path "*file_picker*" -name "build.gradle*" 2>/dev/null | while read -r f; do
            echo "FILE: $f"
            # If still has no compileSdk 36, inject
            if ! grep -q "compileSdk.*36" "$f"; then
              if grep -qE 'android\s*\{' "$f"; then
                sed -i '/android\s*{/a\    compileSdk 36' "$f"
                echo "Injected compileSdk 36 into $f"
              fi
            fi
            cat "$f" | head -50
          done

          # Strip package= from manifests
          find "$HOME/.pub-cache" -path "*/android/src/main/AndroidManifest.xml" -type f 2>/dev/null | while read -r f; do
            if grep -q 'package=' "$f"; then
              sed -i 's/ package="[^"]*"//g' "$f"
              sed -i "s/ package='[^']*'//g" "$f"
            fi
          done
          echo "=== Done plugin patches ==="

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || true

      - name: Build APK
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build.log

      - name: Show errors / APK
        if: always()
        run: |
          tail -50 build.log || true
          grep -E "What went wrong|FAILURE|✓ Built|app-release" build.log | head -20 || true
          find . -name "*.apk" -type f 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            **/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            analyze.log
          if-no-files-found: ignore
          retention-days: 7
          
