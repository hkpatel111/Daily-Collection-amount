name: Build Daily Collection APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: daily_collection_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: daily_collection_app
        run: flutter build apk --release
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-release-apk
          path: daily_collection_app/build/app/outputs/flutter-apk/app-release.apk
