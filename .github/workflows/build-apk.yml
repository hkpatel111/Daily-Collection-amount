name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find and extract ZIP
        run: |
          echo "Files in repo:"
          ls -la
          
          # Find any zip file
          ZIP_FILE=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi
          
          echo "Found ZIP: $ZIP_FILE"
          
          # Extract ZIP
          unzip -o "$ZIP_FILE" -d extracted/
          
          echo "Extracted contents:"
          find extracted/ -type f | head -60

      - name: Find project root folder
        id: findroot
        run: |
          # The ZIP extracts to a folder like "daily_collection_app/"
          # Find the folder that contains pubspec.yaml
          PROJECT_ROOT=$(find extracted/ -name "pubspec.yaml" -not -path "*/.git/*" | head -1 | xargs dirname)
          
          if [ -z "$PROJECT_ROOT" ]; then
            # Maybe files are directly in extracted/
            if [ -f "extracted/pubspec.yaml" ]; then
              PROJECT_ROOT="extracted"
            else
              echo "ERROR: Cannot find pubspec.yaml in extracted ZIP!"
              find extracted/ -type f
              exit 1
            fi
          fi
          
          echo "Project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT
          
          echo "All files in project root:"
          find "$PROJECT_ROOT" -type f | sort

      - name: Copy files to workspace
        run: |
          PROJECT_ROOT="${{ steps.findroot.outputs.project_root }}"
          
          # Copy everything from project root to current directory
          cp -r "$PROJECT_ROOT"/* . 2>/dev/null || true
          cp -r "$PROJECT_ROOT"/.github . 2>/dev/null || true
          cp -r "$PROJECT_ROOT"/.gitignore . 2>/dev/null || true
          
          # Also handle case where files might be nested
          if [ ! -f "pubspec.yaml" ] && [ -d "$PROJECT_ROOT" ]; then
            cp -r "$PROJECT_ROOT"/. .
          fi
          
          echo "Files in workspace after copy:"
          find . -type f -not -path "./.git/*" -not -path "./extracted/*" | sort

      - name: Create missing folders
        run: |
          mkdir -p lib/models
          mkdir -p lib/database/dao
          mkdir -p lib/services
          mkdir -p lib/screens
          mkdir -p lib/widgets
          mkdir -p lib/utils
          mkdir -p test
          mkdir -p android/app/src/main

      - name: Move files to correct folders if needed
        run: |
          # Only move if files are in root (not already in folders)
          
          # Models
          for f in customer.dart loan.dart schedule_entry.dart collection_entry.dart settings.dart; do
            if [ -f "$f" ] && [ ! -f "lib/models/$f" ]; then
              mv "$f" lib/models/
            fi
          done

          # DAOs
          for f in customer_dao.dart loan_dao.dart schedule_dao.dart collection_dao.dart settings_dao.dart; do
            if [ -f "$f" ] && [ ! -f "lib/database/dao/$f" ]; then
              mv "$f" lib/database/dao/
            fi
          done

          # Database helper
          if [ -f "database_helper.dart" ] && [ ! -f "lib/database/database_helper.dart" ]; then
            mv database_helper.dart lib/database/
          fi

          # Services
          for f in calculation_service.dart schedule_service.dart sms_service.dart backup_service.dart; do
            if [ -f "$f" ] && [ ! -f "lib/services/$f" ]; then
              mv "$f" lib/services/
            fi
          done

          # Screens
          for f in dashboard_screen.dart customer_list_screen.dart add_customer_screen.dart customer_detail_screen.dart loan_detail_screen.dart daily_collection_screen.dart pre_close_screen.dart settings_screen.dart; do
            if [ -f "$f" ] && [ ! -f "lib/screens/$f" ]; then
              mv "$f" lib/screens/
            fi
          done

          # Widgets
          for f in stat_card.dart schedule_entry_tile.dart; do
            if [ -f "$f" ] && [ ! -f "lib/widgets/$f" ]; then
              mv "$f" lib/widgets/
            fi
          done

          # Utils
          for f in constants.dart validators.dart; do
            if [ -f "$f" ] && [ ! -f "lib/utils/$f" ]; then
              mv "$f" lib/utils/
            fi
          done

          # Test
          if [ -f "calculation_service_test.dart" ] && [ ! -f "test/calculation_service_test.dart" ]; then
            mv calculation_service_test.dart test/
          fi

          # Move build_apk.yml to .github/workflows if in root
          if [ -f "build_apk.yml" ]; then
            mkdir -p .github/workflows
            mv build_apk.yml .github/workflows/
          fi

          # AndroidManifest
          if [ -f "AndroidManifest.xml" ] && [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            mv AndroidManifest.xml android/app/src/main/
          fi

          echo "=== Final structure ==="
          find . -type f -not -path "./.git/*" -not -path "./extracted/*" -not -path "./.github/*" | sort

      - name: Generate Flutter scaffolding
        run: flutter create --org com.dailyhisab --project-name daily_collection_app .

      - name: Write AndroidManifest.xml with SMS permissions
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <application
                  android:label="Daily Collection"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST

      - name: Verify project structure
        run: |
          echo "=== lib/ structure ==="
          find lib/ -type f | sort
          echo ""
          echo "=== pubspec.yaml ==="
          cat pubspec.yaml
          echo ""
          echo "=== AndroidManifest ==="
          cat android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: build/app/outputs/flutter-apk/app-release.apk
