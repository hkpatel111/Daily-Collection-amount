name: Build Daily Collection APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Find and extract project ZIP
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1); fi
          if [ -z "$ZIP" ]; then echo "No ZIP found in repo root!"; exit 1; fi
          echo "Using: $ZIP"
          rm -rf /tmp/project_src
          mkdir -p /tmp/project_src
          unzip -o "$ZIP" -d /tmp/project_src

      - name: Copy project files correctly
        run: |
          mkdir -p /tmp/build
          if [ -d "/tmp/project_src/daily_collection_app" ]; then
            cp -r /tmp/project_src/daily_collection_app/. /tmp/build/
          else
            cp -r /tmp/project_src/. /tmp/build/
          fi
          ls -la /tmp/build
          if [ ! -f "/tmp/build/pubspec.yaml" ]; then
            echo "Error: pubspec.yaml not found in /tmp/build!"
            exit 1
          fi

      - name: Create Flutter Android scaffolding (v2 embedding fix)
        working-directory: /tmp/build
        run: |
          flutter create --org com.dailyhisab --project-name daily_collection_app .

      - name: Ultimate JVM Toolchain & Namespace Fix for Telephony
        working-directory: /tmp/build
        run: |
          # 1. Telephony namespace fix in pub-cache
          for f in $(find /home/runner/.pub-cache -path "*/telephony-*/android/build.gradle"); do
            if ! grep -q "namespace" "$f"; then
              echo "Injecting namespace into $f"
              sed -i "/android {/a \    namespace 'com.unact.telephony'" "$f"
            fi
          done

          # 2. Force JVM Toolchain 17 and jvmTarget across all subprojects to kill the 1.8 mismatch error
          BUILD_GRADLE="android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            cat >> "$BUILD_GRADLE" << 'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace = project.group
                          }
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
              }
              plugins.withId('kotlin-android') {
                  kotlin {
                      jvmToolchain(17)
                  }
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = '17'
                  }
              }
          }
          EOF
          fi

      - name: Flutter clean + pub get
        working-directory: /tmp/build
        run: |
          flutter clean
          flutter pub get

      - name: Build release APK
        working-directory: /tmp/build
        run: |
          flutter build apk --release

      - name: Find and Save APK
        if: always()
        run: |
          APK=$(find /tmp/build -name "*.apk" 2>/dev/null | head -n 1)
          echo "APK found: $APK"
          mkdir -p /tmp/apk_out
          if [ -n "$APK" ]; then cp "$APK" /tmp/apk_out/daily-collection.apk; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: /tmp/apk_out/
          if-no-files-found: error
