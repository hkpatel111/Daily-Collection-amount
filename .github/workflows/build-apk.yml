name: Build Daily Collection APK (v9)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract source ZIP
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Using ZIP: $ZIP_FILE"
          mkdir -p app_src
          unzip -o "$ZIP_FILE" -d app_src
          cd app_src
          if [ -d "android" ]; then echo "WARNING: android/ folder found in ZIP — deleting (workflow creates fresh)"; rm -rf android; fi

      - name: Flutter create (android only)
        working-directory: app_src
        run: flutter create --org com.dailyhisab --project-name daily_collection_app --platforms=android .

      - name: Set compileSdk / targetSdk 36 (app only, safe sed)
        working-directory: app_src
        run: |
          # Only replace full assignment lines (known broken-sed fix from v8)
          for F in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$F" ]; then
              sed -i 's/^[[:space:]]*compileSdk[[:space:]]*=.*/        compileSdk = 36/' "$F"
              sed -i 's/^[[:space:]]*targetSdk[[:space:]]*=.*/        targetSdk = 36/' "$F"
              sed -i 's/^[[:space:]]*compileSdkVersion[[:space:]]*[0-9a-zA-Z_]*/        compileSdkVersion 36/' "$F"
              sed -i 's/^[[:space:]]*targetSdkVersion[[:space:]]*[0-9a-zA-Z_]*/        targetSdkVersion 36/' "$F"
              echo "=== $F (compileSdk/targetSdk lines) ==="
              grep -nE "(compileSdk|targetSdk|minSdk)" "$F" || true
            else
              echo "NOTE: $F not found"
            fi
          done

      - name: Enable core library desugaring (REQUIRED for flutter_local_notifications)
        working-directory: app_src
        run: |
          # Flutter 3.47 template build.gradle.kts (Kotlin DSL) generate karta hai.
          # Dono cases handle karo — har format ka apna syntax:
          if [ -f android/app/build.gradle.kts ]; then
            # Kotlin DSL: kotlinOptions/jvmTarget AGP 9 par ERROR-level deprecated hain (script compile fail).
            # Sirf compileOptions + dependencies append karo — jvmTarget template khud handle karta hai.
            echo '' | base64 -d >> android/app/build.gradle.kts
            echo "--- Desugaring appended to build.gradle.kts (tail): ---"
            tail -n 14 android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            echo '' | base64 -d >> android/app/build.gradle
            echo "--- Desugaring appended to build.gradle (tail): ---"
            tail -n 25 android/app/build.gradle
          else
            echo "ERROR: koi build.gradle file nahi mili!"
            exit 1
          fi

      - name: Write AndroidManifest with permissions
        working-directory: app_src
        run: |
          echo "" | base64 -d > android/app/src/main/AndroidManifest.xml

      - name: Flutter pub get
        working-directory: app_src
        run: flutter pub get

      - name: Patch telephony plugin (namespace, compileSdk 36, JVM 17, strip manifest package=)
        run: |
          TELE_DIR=$(find ~/.pub-cache -type d -name "telephony-*" | head -n 1)
          if [ -n "$TELE_DIR" ]; then
            GRADLE="$TELE_DIR/android/build.gradle"
            if [ -f "$GRADLE" ]; then
              # Namespace add karo (missing ho to)
              grep -q "namespace" "$GRADLE" || sed -i "s|defaultConfig {|defaultConfig {\n        namespace 'com.kaluwa.fluttertelephony'|" "$GRADLE"
              # compileSdk 36
              sed -i "s/compileSdkVersion [0-9]*/compileSdkVersion 36/" "$GRADLE"
              sed -i "s/compileSdk [0-9]*/compileSdk 36/" "$GRADLE"
              # Existing jvmTarget values ko 17 karo (agar hon)
              sed -i "s/jvmTarget = '1_8'/jvmTarget = '17'/; s/jvmTarget = '1\.8'/jvmTarget = '17'/; s/jvmTarget = '11'/jvmTarget = '17'/; s/jvmTarget = 11/jvmTarget = 17/; s/jvmTarget = 1\.8/jvmTarget = 17/" "$GRADLE"
              sed -i "s/VERSION_1_8/VERSION_17/g; s/VERSION_11/VERSION_17/g" "$GRADLE"
              # JVM 17 block APPEND karo — AGP 9 par missing targets se
              # 'Java (11) vs Kotlin (1.8) Inconsistent JVM Target' hard error aata hai.
              # Base64-encoded snippet (heredoc-in-YAML issue se bachne ke liye)
              echo '' | base64 -d >> "$GRADLE"
              echo "--- telephony build.gradle (tail) ---"
              tail -n 18 "$GRADLE"
            fi
            # Plugin manifest se package= strip karo
            MANIFEST="$TELE_DIR/android/src/main/AndroidManifest.xml"
            if [ -f "$MANIFEST" ]; then
              sed -i 's/ package="[^"]*"//' "$MANIFEST"
            fi
            echo "Telephony patched at $TELE_DIR"
          else
            echo "telephony not found in pub-cache"
          fi

      - name: Flutter analyze (non-blocking, log saved)
        working-directory: app_src
        run: flutter analyze 2>&1 | tee flutter_analyze.log || true

      - name: Build APK (release)
        working-directory: app_src
        run: flutter build apk --release 2>&1 | tee /tmp/build_full.log

      - name: Verify APK exists
        working-directory: app_src
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "SUCCESS: APK found at $APK ($SIZE)"
          else
            echo "BUILD FAILED: APK not found. Last 100 log lines:"
            tail -n 100 /tmp/build_full.log
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: app_src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/build_full.log
            app_src/build/reports
            app_src/flutter_analyze.log
          if-no-files-found: ignore
