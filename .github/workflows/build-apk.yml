name: Build Daily Collection APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Find and extract project ZIP
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1); fi
          if [ -z "$ZIP" ]; then echo "No ZIP found in repo root!"; exit 1; fi
          echo "Using: $ZIP"
          rm -rf /tmp/project_src
          mkdir -p /tmp/project_src
          unzip -o "$ZIP" -d /tmp/project_src

      - name: Copy project files correctly
        run: |
          mkdir -p /tmp/build
          if [ -d "/tmp/project_src/daily_collection_app" ]; then
            cp -r /tmp/project_src/daily_collection_app/. /tmp/build/
          else
            cp -r /tmp/project_src/. /tmp/build/
          fi
          ls -la /tmp/build
          if [ ! -f "/tmp/build/pubspec.yaml" ]; then
            echo "Error: pubspec.yaml not found in /tmp/build!"
            exit 1
          fi

      - name: Create Flutter Android scaffolding (v2 embedding fix)
        working-directory: /tmp/build
        run: |
          flutter create --org com.dailyhisab --project-name daily_collection_app .

      - name: Flutter clean + pub get
        working-directory: /tmp/build
        run: |
          flutter clean
          flutter pub get

      - name: Fix missing namespaces in pub plugins (Telephony fix)
        run: |
          find /home/runner/.pub-cache -name "AndroidManifest.xml" | while read manifest; do
            if grep -q "package=" "$manifest"; then
              pkg=$(grep -o 'package="[^"]*"' "$manifest" | head -1 | cut -d'"' -f2)
              gradle_file=$(dirname "$manifest")/../build.gradle
              if [ -f "$gradle_file" ] && ! grep -q "namespace" "$gradle_file"; then
                echo "Adding namespace $pkg to $gradle_file"
                sed -i "/android {/a \    namespace '$pkg'" "$gradle_file"
              fi
            fi
          done

      - name: Build release APK
        working-directory: /tmp/build
        run: |
          flutter build apk --release

      - name: Find and Save APK
        if: always()
        run: |
          APK=$(find /tmp/build -name "*.apk" 2>/dev/null | head -n 1)
          echo "APK found: $APK"
          mkdir -p /tmp/apk_out
          if [ -n "$APK" ]; then cp "$APK" /tmp/apk_out/daily-collection.apk; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: /tmp/apk_out/
          if-no-files-found: error
