name: Fix and Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create folder structure
        run: |
          mkdir -p lib/models
          mkdir -p lib/database/dao
          mkdir -p lib/services
          mkdir -p lib/screens
          mkdir -p lib/widgets
          mkdir -p lib/utils
          mkdir -p test
          mkdir -p android/app/src/main

      - name: Move files to correct folders
        run: |
          # Models
          for f in customer.dart loan.dart schedule_entry.dart collection_entry.dart settings.dart; do
            [ -f "$f" ] && mv "$f" lib/models/
          done

          # DAOs
          for f in customer_dao.dart loan_dao.dart schedule_dao.dart collection_dao.dart settings_dao.dart; do
            [ -f "$f" ] && mv "$f" lib/database/dao/
          done

          # Database
          [ -f database_helper.dart ] && mv database_helper.dart lib/database/

          # Services
          for f in calculation_service.dart schedule_service.dart sms_service.dart backup_service.dart; do
            [ -f "$f" ] && mv "$f" lib/services/
          done

          # Screens
          for f in dashboard_screen.dart customer_list_screen.dart add_customer_screen.dart customer_detail_screen.dart loan_detail_screen.dart daily_collection_screen.dart pre_close_screen.dart settings_screen.dart; do
            [ -f "$f" ] && mv "$f" lib/screens/
          done

          # Widgets
          for f in stat_card.dart schedule_entry_tile.dart; do
            [ -f "$f" ] && mv "$f" lib/widgets/
          done

          # Utils
          for f in constants.dart validators.dart; do
            [ -f "$f" ] && mv "$f" lib/utils/
          done

          # Test
          [ -f calculation_service_test.dart ] && mv calculation_service_test.dart test/

          # AndroidManifest
          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml android/app/src/main/
          fi

          # Move build_apk.yml to .github/workflows if it's in root
          if [ -f build_apk.yml ]; then
            mkdir -p .github/workflows
            mv build_apk.yml .github/workflows/
          fi

      - name: Write AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <application
                  android:label="Daily Collection"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST

      - name: Generate Flutter scaffolding
        run: flutter create --org com.dailyhisab --project-name daily_collection_app .

      - name: Restore AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <application
                  android:label="Daily Collection"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-collection-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
